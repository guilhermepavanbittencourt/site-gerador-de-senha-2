<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Legíveis (Leetspeak)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Estilo Personalizado -->
    <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 mb-3 text-xl">
                <i class="fa-solid fa-shield-cat"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Senha Legível</h1>
            <p class="text-sm text-slate-400 mt-1">Transforme palavras fáceis em senhas seguras e válidas.</p>
        </div>

        <!-- Exibição da Senha Gerada -->
        <div class="relative bg-slate-950 border border-slate-800 rounded-xl p-4 mb-6 flex items-center justify-between">
            <span id="passwordOutput" class="text-xl sm:text-2xl font-mono text-indigo-400 tracking-wider truncate mr-2 select-all">Clique em Gerar</span>
            <button onclick="copyPassword()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-lg transition-all flex-shrink-0 active:scale-95" title="Copiar senha">
                <i id="copyIcon" class="fa-regular fa-copy"></i>
            </button>
        </div>

        <!-- Controles de Personalização -->
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Palavra Base (Opcional)</label>
                <input type="text" id="baseWordInput" placeholder="Deixe em branco para palavra aleatória" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <label class="flex items-center space-x-2 text-sm text-slate-300 cursor-pointer select-none">
                    <input type="checkbox" id="addSymbols" checked class="rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-0">
                    <span>Adicionar Símbolos</span>
                </label>
                <label class="flex items-center space-x-2 text-sm text-slate-300 cursor-pointer select-none">
                    <input type="checkbox" id="addNumbers" checked class="rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-0">
                    <span>Misturar Números</span>
                </label>
            </div>
        </div>

        <!-- Botão de Gerar -->
        <button onclick="generatePassword()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/20 active:scale-98 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Gerar Senha Inteligente</span>
        </button>

        <!-- Informações de Segurança -->
        <div class="mt-6 pt-6 border-t border-slate-800 text-xs text-slate-500 flex justify-between items-center">
            <span>Segurança: <strong id="strengthText" class="text-amber-400">Média</strong></span>
            <span>Fácil de memorizar</span>
        </div>

    </div>

    <!-- Script JavaScript Principal -->
    <script src="./main.js"></script>
</body>
</html>
